<svg xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink' width='1000' height='620' viewBox='0 0 1000 620'><rect width='1000' height='620' fill='#ffffff'/><rect width='1000' height='52' fill='#2b2d42'/><text x='20' y='34.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='24' fill='#fff' text-anchor='start' font-weight='bold' font-style='normal'>Schritt 4 · ZUERST: Netzstecker ziehen! / FIRST: unplug!</text><rect x='80' y='130' width='220' height='220' rx='30' fill='#eee' stroke='#777' stroke-width='3'/><circle cx='190' cy='240' r='80' fill='#ddd' stroke='#999' stroke-width='3'/><circle cx='160' cy='240' r='12' fill='#333'/><circle cx='220' cy='240' r='12' fill='#333'/><rect x='420' y='180' width='150' height='120' rx='20' fill='#222' stroke='#000' stroke-width='2'/><rect x='570' y='225' width='60' height='10' fill='#aaa'/><rect x='570' y='245' width='60' height='10' fill='#aaa'/><path d='M420,240 C360,240 380,400 300,420' stroke='#222' stroke-width='14' fill='none'/><path d='M340,170 L400,170' stroke='#d00000' stroke-width='10' marker-end='url(#ar)'/><defs><marker id='ar' markerWidth='6' markerHeight='6' refX='3' refY='3' orient='auto'><path d='M0,0 L6,3 L0,6 z' fill='#d00000'/></marker></defs><text x='370' y='150.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='20' fill='#d00000' text-anchor='middle' font-weight='bold' font-style='normal'>raus / out</text><polygon points='800,110 940,350 660,350' fill='#ffd60a' stroke='#111' stroke-width='8' stroke-linejoin='round'/><path d='M815,160 L770,250 L810,250 L780,330 L850,220 L810,220 L835,160 z' fill='#111'/><text x='800' y='395.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='34' fill='#d00000' text-anchor='middle' font-weight='bold' font-style='normal'>230 V</text><rect x='40' y='430' width='920' height='70' rx='8' fill='#fff4e5' stroke='#ff9500' stroke-width='3'/><text x='54' y='460.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='24' fill='#d00000' text-anchor='start' font-weight='normal' font-style='normal'>⚠</text><text x='86' y='458.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='17' fill='#7a4100' text-anchor='start' font-weight='bold' font-style='normal'>Ausschalten reicht NICHT. Stecker raus, 2 Minuten warten (Motorkondensator).</text><text x='86' y='479.25' font-family='DejaVu Sans, Arial, sans-serif' font-size='17' fill='#7a4100' text-anchor='start' font-weight='bold' font-style='normal'>Switching off is NOT enough. Unplug, wait 2 minutes (motor capacitor).</text><text x='40' y='560.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='18' fill='#2a7a2a' text-anchor='start' font-weight='bold' font-style='normal'>✔ Nur im Niederspannungsteil arbeiten (12 V / 5 V). An 230-V-Teile nie löten.</text><text x='40' y='590.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='16' fill='#2a7a2a' text-anchor='start' font-weight='normal' font-style='normal'>✔ Work only on the low-voltage side (12 V / 5 V). Never solder to 230 V parts.</text></svg>