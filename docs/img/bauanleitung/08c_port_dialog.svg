<svg xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink' width='1200' height='610' viewBox='0 0 1200 610'><rect width='1200' height='610' fill='#ffffff'/><rect width='1200' height='70' fill='#2b2d42'/><text x='20' y='34.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='24' fill='#fff' text-anchor='start' font-weight='bold' font-style='normal'>Schritt 8c · Port wählen / choose serial port</text><text x='20' y='60.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='15' fill='#d0d4e4' text-anchor='start' font-weight='normal' font-style='italic'>Illustration (vereinfacht) – so sieht der Browser-Dialog ungefähr aus</text><rect x='250' y='100' width='700' height='380' rx='12' fill='#fff' stroke='#888' stroke-width='2'/><text x='275' y='140.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='18' fill='#222' text-anchor='start' font-weight='bold' font-style='normal'>dobbynator94.github.io möchte eine Verbindung</text><text x='275' y='164.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='18' fill='#222' text-anchor='start' font-weight='bold' font-style='normal'>zu einem seriellen Port herstellen</text><rect x='275' y='190' width='650' height='48' rx='6' fill='#dbeafe' stroke='#1d6fd8' stroke-width='3'/><text x='295' y='220.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='16' fill='#222' text-anchor='start' font-weight='bold' font-style='normal'>USB JTAG/serial debug unit (COM5)  –  gekoppelt</text><rect x='275' y='246' width='650' height='48' rx='6' fill='#f6f6f6' stroke='#ddd' stroke-width='1'/><text x='295' y='276.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='16' fill='#222' text-anchor='start' font-weight='normal' font-style='normal'>Bluetooth-Verbindung (COM3)</text><rect x='275' y='302' width='650' height='48' rx='6' fill='#f6f6f6' stroke='#ddd' stroke-width='1'/><text x='295' y='332.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='16' fill='#222' text-anchor='start' font-weight='normal' font-style='normal'>Kommunikationsanschluss (COM1)</text><rect x='660' y='410' width='120' height='44' rx='6' fill='#1a73e8' stroke='#1a73e8' stroke-width='2'/><text x='720' y='438.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='16' fill='#fff' text-anchor='middle' font-weight='bold' font-style='normal'>Verbinden</text><rect x='800' y='410' width='120' height='44' rx='6' fill='#fff' stroke='#999' stroke-width='2'/><text x='860' y='438.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='16' fill='#333' text-anchor='middle' font-weight='normal' font-style='normal'>Abbrechen</text><text x='160' y='220.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='40' fill='#1d6fd8' text-anchor='middle' font-weight='bold' font-style='normal'>①</text><text x='160' y='252.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='14' fill='#1d6fd8' text-anchor='middle' font-weight='normal' font-style='normal'>wählen</text><text x='720' y='510.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='18' fill='#1a73e8' text-anchor='middle' font-weight='bold' font-style='normal'>② „Verbinden“ / Connect</text><text x='40' y='560.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='15' fill='#333' text-anchor='start' font-weight='normal' font-style='normal'>Windows: „USB JTAG/serial debug unit“ oder „USB-Serial (COMx)“.  macOS: „cu.usbmodem…“.  Linux: „ttyACM0“.</text><text x='40' y='588.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='15' fill='#b00' text-anchor='start' font-weight='bold' font-style='normal'>Kein Eintrag? → Datenkabel prüfen, anderen USB-Port, dann BOOT-Modus (Schritt 8g).</text></svg>