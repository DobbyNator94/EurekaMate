<svg xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink' width='1200' height='600' viewBox='0 0 1200 600'><rect width='1200' height='600' fill='#ffffff'/><rect width='1200' height='70' fill='#2b2d42'/><text x='20' y='34.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='24' fill='#fff' text-anchor='start' font-weight='bold' font-style='normal'>Schritt 8d · Installieren + Löschen / Install + erase</text><text x='20' y='60.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='15' fill='#d0d4e4' text-anchor='start' font-weight='normal' font-style='italic'>Illustration (vereinfacht) des ESP-Web-Tools-Dialogs</text><rect x='120' y='100' width='440' height='400' rx='14' fill='#fff' stroke='#888' stroke-width='2'/><text x='340' y='145.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='22' fill='#222' text-anchor='middle' font-weight='bold' font-style='normal'>EurekaMate</text><rect x='170' y='190' width='340' height='52' rx='8' fill='#03a9f4' stroke='#03a9f4' stroke-width='2'/><text x='340' y='223.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='17' fill='#fff' text-anchor='middle' font-weight='bold' font-style='normal'>INSTALL EUREKAMATE</text><rect x='170' y='260' width='340' height='44' rx='8' fill='#fff' stroke='#ccc' stroke-width='2'/><text x='340' y='288.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='15' fill='#555' text-anchor='middle' font-weight='normal' font-style='normal'>LOGS &amp; CONSOLE</text><text x='340' y='360.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='18' fill='#0277bd' text-anchor='middle' font-weight='bold' font-style='normal'>①  hier klicken / click</text><rect x='640' y='100' width='440' height='400' rx='14' fill='#fff' stroke='#888' stroke-width='2'/><text x='860' y='145.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='20' fill='#222' text-anchor='middle' font-weight='bold' font-style='normal'>Install EurekaMate</text><rect x='690' y='190' width='26' height='26' rx='4' fill='#03a9f4' stroke='#0277bd' stroke-width='2'/><text x='703' y='210.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='18' fill='#fff' text-anchor='middle' font-weight='bold' font-style='normal'>✔</text><text x='730' y='210.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='17' fill='#222' text-anchor='start' font-weight='normal' font-style='normal'>Erase device / Gerät löschen</text><text x='690' y='260.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='15' fill='#444' text-anchor='start' font-weight='normal' font-style='normal'>Do you want to install EurekaMate</text><text x='690' y='282.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='15' fill='#444' text-anchor='start' font-weight='normal' font-style='normal'>0.1.0-beta? All data will be erased.</text><rect x='940' y='420' width='110' height='44' rx='8' fill='#03a9f4' stroke='#03a9f4' stroke-width='2'/><text x='995' y='448.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='15' fill='#fff' text-anchor='middle' font-weight='bold' font-style='normal'>INSTALL</text><rect x='820' y='420' width='100' height='44' rx='8' fill='#fff' stroke='#ccc' stroke-width='2'/><text x='870' y='448.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='15' fill='#0277bd' text-anchor='middle' font-weight='bold' font-style='normal'>NEXT</text><text x='860' y='360.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='17' fill='#0277bd' text-anchor='middle' font-weight='bold' font-style='normal'>② Haken setzen → Next → Install</text><text x='40' y='545.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='15' fill='#333' text-anchor='start' font-weight='normal' font-style='normal'>Beim ersten Mal: „Erase device“ anhaken (alte Firmware weg). Bei Updates per USB: Haken weg = Einstellungen bleiben.</text><text x='40' y='572.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='14' fill='#555' text-anchor='start' font-weight='normal' font-style='italic'>First time: tick “Erase device”. Re-flash via USB: untick to keep your settings.</text></svg>